name: Quality checks & deployment

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: "true"
  HUSKY: "0"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  checks:
    name: Lint, type-check, build & integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: kuki
          POSTGRES_PASSWORD: kuki
          POSTGRES_DB: kuki
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kuki -d kuki"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      TEST_DATABASE_URL: postgres://kuki:kuki@localhost:5432/kuki_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.3"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.5"
          enable-cache: true
          cache-dependency-glob: apps/ai/uv.lock
      - name: Install JavaScript dependencies
        run: bun install --frozen-lockfile
      - name: Install Python dependencies
        run: uv sync --frozen --python 3.12
        working-directory: apps/ai
      - name: Lint
        run: bun run lint
      - name: Type-check
        run: bun run check-types
      - name: Build
        run: bun run build
      - name: Integration and Python tests
        run: bun run test -- --force

  e2e:
    name: End-to-end browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.3"
      - run: bun install --frozen-lockfile
      - name: Install Chromium
        run: bunx playwright install --with-deps chromium
        working-directory: tests/e2e
      - name: Run browser tests
        run: bun run test:e2e
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: tests/e2e/test-results/
          retention-days: 7
          if-no-files-found: ignore

  deploy:
    name: Production deployment
    needs: [checks, e2e]
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    concurrency:
      group: production-deployment
      cancel-in-progress: false
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_CLI_VERSION: ${{ vars.VERCEL_CLI_VERSION }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.3"
      - name: Validate deployment configuration
        shell: bash
        run: |
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID VERCEL_CLI_VERSION; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing deployment setting: $name"
              exit 1
            fi
          done
          if [[ ! "$VERCEL_CLI_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::VERCEL_CLI_VERSION must be an exact stable version (X.Y.Z)"
            exit 1
          fi
      - name: Install Vercel CLI
        run: npm install --global "vercel@$VERCEL_CLI_VERSION"
      - name: Prepare worker build context
        run: bash scripts/prepare-worker-build.sh
      # Daemon images must be built on Vercel; local `vercel build` rejects them.
      - name: Build and deploy production on Vercel
        run: vercel deploy --prod --yes --token="$VERCEL_TOKEN"
