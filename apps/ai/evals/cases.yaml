    values: [{ value: 631510 }]
    primary: 631510
    mentions:
      [
        [
          "30-05-2024",
          "2024-05-30",
          "30 May 2024",
          "30.05.2024",
          "May 30, 2024",
        ],
      ]
    sources: [{ document: Adani commercial electricity bill.pdf, page: 1 }]

- id: E04
