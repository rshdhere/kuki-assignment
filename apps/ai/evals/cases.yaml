- id: E05
  title: Water consumption vs meter readings
  question: "Does the water consumption match the meter readings?"
  documents: [water_bill_invoice.pdf]
  source: "Water p.1, current reading 14821, previous 12500, consumption 2321"
  expect:
    status: [answered]
    values: [{ value: 14821 }, { value: 12500 }, { value: 2321 }]
    calculation: [2321]
    sources: [{ document: water_bill_invoice.pdf, page: 1 }]

- id: E06
  title: Water bill total due and GST
  question: "What is the total amount due on the water bill, and how much of it is GST?"
  documents: [water_bill_invoice.pdf]
  source: 'Water p.2, "TOTAL AMOUNT DUE: ₹158,733.62" and "Tax (5% GST): ₹7,558.74" on a subtotal of ₹151,174.88'
  expect:
    status: [answered]
    values: [{ value: 158733.62 }, { value: 7558.74 }]
    primary: 158733.62
    sources: [{ document: water_bill_invoice.pdf, page: 2 }]

- id: E07
  title: Total waste quantity
  question: "What total waste quantity is recorded?"
  documents: [form 3 filled.docx.pdf]
  source: "Form 3 p.1, entries 1.0 + 0.5 + 0.5 + 0.4 MT dated 10.03.2023"
  expect:
    status: [answered, partial]
    values: [{ value: 2.4, tolerance: 0.001 }]
    calculation: [2.4]
    mentions: [["MT", "tonne", "metric ton"]]
    sources: [{ document: form 3 filled.docx.pdf, page: 1 }]

- id: E08
  title: Form 3 date inconsistency
  question: "Are the dates on the waste record (Form 3) consistent with each other?"
  documents: [form 3 filled.docx.pdf]
  source: 'Form 3 p.2 "Date: 08.03.2022" next to the occupier''s signature, while every entry on p.1 is dated 10.03.2023'
  expect:
    status: [conflicting_evidence, answered, partial]
    sources:
      - { document: form 3 filled.docx.pdf, page: 1 }
      - { document: form 3 filled.docx.pdf, page: 2 }
    mentions:
      - [
          "08.03.2022",
          "2022-03-08",
          "8 March 2022",
          "08-03-2022",
          "March 8, 2022",
        ]
      - [
          "10.03.2023",
          "2023-03-10",
          "10 March 2023",
          "10-03-2023",
          "March 10, 2023",
        ]
      - [
          "inconsisten",
          "not consistent",
          "mismatch",
          "precede",
          "before the",
          "earlier than",
          "do not match",
          "don't match",
        ]
    gaps: true

