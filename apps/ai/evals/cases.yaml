# Eval cases over the six assignment documents (put them in data/documents/).
#
# Each case gives the question, the documents in scope, and what a correct
# answer must contain. `expect` keys (all optional):
#   status       allowed answer statuses
#   values       numbers that must appear among the answer's key values or text
#                ({value, tolerance?}); tolerance is absolute, default 0.5% of value
#   primary      the first key value must be this number (the figure being asked for)
#   forbidden    numbers that must not be presented as key values ({value, unit?})
#   mentions     groups of alternatives; each group needs one match in the answer
#   sources      locations that verified evidence must cite ({document, page} or
#                {document, sheet, cell_range})
#   calculation  a checked calculation must produce one of these values
#   gaps         true if the answer must state gaps/limits
#
# Expected values were read by hand from the documents; `source` says where.

- id: E01
  title: Adani consumption and billing period
  question: "What electricity consumption does the Adani bill report, and for which billing period?"
  documents: [Adani commercial electricity bill.pdf]
  source: 'Adani p.1, "Units Consumed 47407", "Bill Period 01-04-2024 - 30.04.2024"; p.2 consumption table also states "Consumption (kWh) 47407" ((4132.27 - 3539.68) x MF 80)'
  expect:
    status: [answered]
    values: [{ value: 47407 }]
    primary: 47407
    mentions:
      - [
          "2024-04-01",
          "01-04-2024",
          "1 April 2024",
          "01.04.2024",
          "April 1, 2024",
          "1 Apr 2024",
        ]
      - [
          "2024-04-30",
          "30-04-2024",
          "30 April 2024",
          "30.04.2024",
          "April 30, 2024",
          "30 Apr 2024",
        ]
    sources: [{ document: Adani commercial electricity bill.pdf, page: [1, 2] }]

- id: E02
  title: BESCOM consumption in kWh, not kVAh
  question: "What electricity consumption does the BESCOM bill report in kWh, and for which period?"
  documents: [BESCOM Commercial Electricity Bill.pdf]
  source: "BESCOM p.1, kWh consumption 63000 (the kVAh figure is 63359.86); period 01-06-2024 to 01-07-2024"
  expect:
    status: [answered]
    values: [{ value: 63000 }]
    primary: 63000
    forbidden: [{ value: 63359.86, unit: kWh }]
    mentions:
      - [
          "2024-06-01",
          "01-06-2024",
          "1 June 2024",
          "01.06.2024",
          "June 1, 2024",
          "1 Jun 2024",
        ]
      - [
          "2024-07-01",
          "01-07-2024",
          "1 July 2024",
          "01.07.2024",
          "July 1, 2024",
          "1 Jul 2024",
        ]
    sources: [{ document: BESCOM Commercial Electricity Bill.pdf, page: 1 }]

