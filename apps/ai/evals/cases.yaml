  documents: [Annual Electricity Consumption.xlsx]
  source: 'Monthly Summary 2026 F3:F14 sums to 2426123; F16 "ANNUAL TOTAL" 2425123; Quarterly Summary G7 2427123'
  expect:
    status: [conflicting_evidence]
    values: [{ value: 2426123 }, { value: 2425123 }, { value: 2427123 }]
    calculation: [2426123]
    sources:
      - {
          document: Annual Electricity Consumption.xlsx,
          sheet: Monthly Summary 2026,
          cell_range: F16,
        }
      - {
          document: Annual Electricity Consumption.xlsx,
          sheet: Quarterly Summary,
          cell_range: G7,
        }
    gaps: true

