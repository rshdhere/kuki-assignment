[project]
name = "kuki-ai"
version = "0.1.0"
description = "Extraction, question answering, financial-year totals and evals for KuKi sustainability documents"
requires-python = ">=3.12"
dependencies = [
  "boto3>=1.35",
  "fastapi>=0.115",
  "openai>=1.99",
  "openpyxl>=3.1",
  "pydantic>=2.9",
  "pymupdf>=1.25",
  "python-dotenv>=1.0",
  "pyyaml>=6.0",
  "uvicorn>=0.32",
]

[dependency-groups]
dev = ["httpx>=0.27", "pytest>=8.3", "ruff>=0.8"]

[project.scripts]
kuki-eval = "kuki_ai.evals.run:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kuki_ai"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# The formatter wraps code; long strings and prompts are left alone.
ignore = ["E501"]
