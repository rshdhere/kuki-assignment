# Local Postgres for development and integration tests.
#   bun run db:up     start it
#   bun run db:seed   create the kuki and kuki_test databases and migrate them
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: kuki
      POSTGRES_PASSWORD: kuki
      POSTGRES_DB: kuki
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kuki -d kuki"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  postgres-data:
